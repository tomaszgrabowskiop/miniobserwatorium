<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elektronika</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0d11; color: #f3f4f6; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #canvas-container { width: 100vw; height: 100vh; position: relative; overflow: hidden; background: radial-gradient(circle at 46% 48%, #181e29 0%, #0b0d11 76%); }
  #canvas-container canvas { position: absolute !important; inset: 0 !important; width: 100% !important; height: 100% !important; display: block !important; }
  .bar { position: absolute; z-index: 5; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; }
  .bar.top { top: 12px; left: 12px; right: 12px; }
  .bar.bottom { bottom: 12px; left: 12px; right: 12px; }
  .btn-ctrl { pointer-events: auto; border: 1px solid rgba(255,255,255,0.14); background: rgba(30,34,43,0.88); color: #e2e8f0; padding: 6px 11px; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; }
  .btn-ctrl:hover { background: rgba(52,59,74,0.96); }
  .btn-ctrl.active { background: #0284c7; color: #fff; border-color: #bae6fd; font-weight: 600; }
</style>
</head>
<body data-part="elektronika">
<div id="canvas-container"></div>

<div class="bar bottom">
  <button onclick="toggleShell()" id="btn-shell" class="btn-ctrl">Ściany pełne</button>
</div>
<script src="./_silnik.js"></script>
</body>
</html>
